<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive field guide to end-to-end encryption and the Messaging Layer Security protocol. Explore key trees, change group membership, and learn how to build with MLS.">
  <meta name="theme-color" content="#f7f7f2">
  <title>MLS, explained — An interactive field guide</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f2;
      --ink: #272c28;
      --subtle: #5f665e;
      --line: #dadcd2;
      --orange: #ad3c20;
      --orange-soft: #f6e6db;
      --green: #325b43;
      --green-soft: #e6eddf;
      --surface: #ffffff;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--foreground, var(--ink)); font-family: var(--font-sans, var(--sans)); -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button, a, input[type="range"], summary { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .46; }
    button, a, summary { touch-action: manipulation; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
    h1, h2, h3, p, figure { margin: 0; }
    h1, h2 { font-weight: 500; letter-spacing: -.052em; line-height: 1.04; text-wrap: balance; }
    h3 { font-size: 21px; font-weight: 500; letter-spacing: -.025em; line-height: 1.25; }
    a { color: var(--green); text-underline-offset: 4px; }
    svg { display: block; max-width: 100%; }
    .icon { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .skip { position: absolute; top: -100px; left: 15px; z-index: 10; padding: 12px; background: var(--surface); }
    .skip:focus { top: 8px; }
    .app { max-width: 1440px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 94px; margin: 0 30px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; letter-spacing: -.025em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: #fff; background: var(--orange); border-radius: 8px; }
    .brand-slash { color: #989c92; padding: 0 4px; font-weight: 400; }
    .topbar-right { display: flex; align-items: center; gap: 25px; }
    .micro { font-family: var(--mono); text-transform: uppercase; font-size: 11px; letter-spacing: .1em; line-height: 1.5; }
    .muted { color: var(--subtle); }
    .tools { display: flex; gap: 6px; }
    .tool { border: 1px solid transparent; background: none; width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; transition: background .18s, border-color .18s; }
    .tool:hover, .tool[aria-pressed="true"] { background: var(--secondary, var(--green-soft)); border-color: var(--border, var(--line)); }
    .topbar .muted { color: var(--muted-foreground, var(--subtle)); }
    .chapters { display: flex; gap: 7px; padding: 0 30px 20px; overflow-x: auto; scrollbar-width: thin; }
    .chapter { white-space: nowrap; background: none; color: var(--muted-foreground, var(--subtle)); border: 1px solid transparent; border-radius: 99px; font-size: 12px; padding: 10px 16px; min-height: 42px; transition: background .18s; }
    .chapter span { font-family: var(--mono); color: var(--muted-foreground, var(--subtle)); font-size: 10px; margin-right: 8px; }
    .chapter:hover { background: var(--secondary, #f0f1e9); }
    .chapter[aria-current="step"] { background: var(--ink); color: #fff; }
    .chapter[aria-current="step"] span { color: #ced4c9; }
    .stage { margin: 0 20px; border: 1px solid var(--line); border-radius: var(--radius, 18px); background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
    .slide { min-height: 650px; padding: 46px 54px 24px; display: flex; flex-direction: column; animation: enter .3s ease-out; }
    .slide-content { flex: 1; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--subtle); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 22px; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); flex: 0 0 auto; }
    .slide h2 { font-size: clamp(36px, 4.2vw, 59px); max-width: 1180px; margin-bottom: 20px; }
    .slide h2:focus, .slide h1:focus { outline: none; }
    .lead { color: var(--subtle); font-size: 17px; line-height: 1.65; max-width: 620px; }
    .slide-foot { display: flex; justify-content: space-between; align-items: end; gap: 14px; padding-top: 27px; margin-top: 25px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10px; color: var(--subtle); line-height: 1.6; }
    .slide-foot a { color: var(--subtle); }
    .slide-foot .folio { flex: 0 0 auto; letter-spacing: .12em; }
    .split { display: grid; grid-template-columns: .88fr 1.25fr; gap: 45px; align-items: center; margin-top: 25px; }
    .split.top { align-items: start; }
    .cover-grid { display: grid; grid-template-columns: 1.04fr 1fr; align-items: center; gap: 20px; min-height: 480px; }
    .cover h1 { font-size: clamp(52px, 5.8vw, 83px); margin-bottom: 25px; }
    .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; color: var(--orange); }
    .cover .lead { max-width: 430px; font-size: 17px; }
    .cover-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; color: var(--subtle); margin-bottom: 35px; font-size: 11px; font-family: var(--mono); }
    .tag { border: 1px solid var(--line); border-radius: 99px; padding: 5px 9px; font-family: var(--mono); font-size: 10px; display: inline-flex; align-items: center; gap: 6px; color: var(--subtle); white-space: nowrap; }
    .tag.green { border-color: #c3d1ba; background: var(--green-soft); color: var(--green); }
    .tag.orange { border-color: #e3c4b5; background: var(--orange-soft); color: var(--orange); }
    .actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 28px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 13px 18px; min-height: 46px; font-size: 13px; font-weight: 500; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; text-decoration: none; transition: background .18s, transform .18s; }
    .button:hover:not(:disabled) { background: #41493f; transform: translateY(-1px); }
    .button.secondary { background: transparent; border-color: var(--line); color: var(--ink); }
    .button.secondary:hover:not(:disabled) { background: var(--green-soft); }
    .button.accent { background: var(--orange); border-color: var(--orange); }
    .text-button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 5px 0; border: 0; background: none; font-size: 12px; color: var(--subtle); text-decoration: underline; text-underline-offset: 4px; }
    .hero-art { position: relative; color: var(--green); width: 100%; max-width: 520px; justify-self: center; }
    .hero-art svg { width: 100%; }
    .hero-caption { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: -5px; color: var(--green); font-family: var(--mono); font-size: 10px; letter-spacing: .025em; }
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .hero-orbit { transform-origin: 260px 235px; animation: breathe 6s ease-in-out infinite; }
    .footer { padding: 22px 30px 25px; }
    .progress { display: flex; gap: 5px; margin-bottom: 19px; }
    .progress button { flex: 1; min-width: 0; height: 20px; background: none; border: 0; padding: 7px 0; }
    .progress button::after { content: ""; display: block; height: 3px; background: #dcdfd5; border-radius: 3px; transition: background .2s; }
    .progress button.past::after { background: #acb7a4; }
    .progress button[aria-current="step"]::after { background: var(--orange); }
    .progress button:hover::after { background: var(--orange); }
    .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .key-hints { display: flex; gap: 18px; align-items: center; font-size: 11px; color: var(--muted-foreground, var(--subtle)); }
    .footer .text-button { color: var(--muted-foreground, var(--subtle)); }
    kbd { font-family: var(--font-mono, var(--mono)); font-size: 10px; background: var(--secondary, #f4f5f0); border: 1px solid var(--border, var(--line)); border-radius: 4px; padding: 3px 5px; margin-right: 3px; }
    .slide-controls { display: flex; align-items: center; gap: 15px; }
    .counter { min-width: 63px; color: var(--muted-foreground, var(--subtle)); font: 11px var(--mono); }
    .nav-button { display: grid; place-items: center; background: none; border: 1px solid var(--border, var(--line)); border-radius: 8px; width: 44px; height: 44px; }
    .nav-button.next { background: var(--ink); color: #fff; border-color: var(--ink); }
    .nav-button:hover:not(:disabled) { border-color: var(--orange); }
    .notes { margin: 0 20px 20px; background: var(--green-soft); color: var(--ink); border: 1px solid #c6d2be; border-radius: 10px; padding: 20px 24px; font-size: 14px; line-height: 1.7; }
    .notes h3 { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--green); margin-bottom: 10px; }
    [hidden] { display: none !important; }
    .panel { border: 1px solid var(--line); border-radius: 12px; padding: 24px; background: #f0f1e9; }
    .white-panel { background: var(--surface); }
    .callout { padding: 14px 17px; border-left: 2px solid var(--orange); background: var(--orange-soft); color: #763a25; font-size: 12px; line-height: 1.65; margin-top: 20px; }
    .small { font-size: 12px; color: var(--subtle); line-height: 1.7; }
    .subhead { font: 10px var(--mono); color: var(--subtle); text-transform: uppercase; letter-spacing: .09em; margin-bottom: 14px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; border: 1px solid var(--line); border-radius: 10px; background: #eceee5; width: fit-content; }
    .tab { background: none; border: 1px solid transparent; padding: 11px 15px; min-height: 42px; border-radius: 6px; font-size: 12px; color: var(--subtle); }
    .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: 0 2px 3px #22221107; }
    .concept-list { display: grid; gap: 18px; margin-top: 24px; }
    .concept { display: flex; align-items: flex-start; gap: 12px; }
    .concept .icon { color: var(--green); margin-top: 1px; }
    .concept strong { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .concept p { color: var(--subtle); font-size: 12px; line-height: 1.6; }
    .transport { margin-top: 24px; }
    .route { display: grid; grid-template-columns: 1fr .5fr 1.18fr .5fr 1fr; align-items: center; margin-top: 20px; }
    .endpoint { text-align: center; }
    .device { display: grid; place-items: center; width: 56px; height: 66px; border: 1.5px solid #9ba78e; border-radius: 10px; background: var(--green-soft); margin: 0 auto 10px; }
    .device .icon { width: 28px; height: 28px; color: var(--green); }
    .endpoint strong { display: block; font-size: 13px; font-weight: 500; }
    .endpoint span { display: block; font-size: 11px; color: var(--subtle); margin-top: 4px; }
    .wire { border-top: 1px dashed #9aab90; position: relative; margin-top: -45px; }
    .wire .icon { position: absolute; top: -9px; left: calc(50% - 8px); width: 16px; height: 16px; color: var(--green); background: #f0f1e9; }
    .server { padding: 20px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; text-align: center; }
    .server > .icon { width: 27px; height: 27px; margin: 0 auto 10px; color: var(--subtle); }
    .server h3 { font-size: 13px; }
    .payload { padding: 14px 8px; margin: 14px -17px; background: var(--orange-soft); color: var(--orange); border: 1px solid #e0c3b3; border-radius: 6px; font: 11px var(--mono); white-space: nowrap; }
    .payload.encrypted { background: var(--green-soft); color: var(--green); border-color: #c3d1ba; letter-spacing: 1px; }
    .route-message { margin-top: 20px; font-size: 13px; line-height: 1.7; min-height: 65px; }
    .timeline-tabs { display: grid; grid-template-columns: repeat(5,1fr); margin: 30px 0 0; border-bottom: 1px solid var(--line); gap: 0; }
    .milestone { border: 0; background: none; position: relative; padding: 15px 5px 22px; text-align: left; color: var(--subtle); }
    .milestone::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #b9c0b1; left: 5px; bottom: -4px; }
    .milestone[aria-selected="true"]::after { background: var(--orange); box-shadow: 0 0 0 5px var(--orange-soft); }
    .milestone .year { display: block; font-size: 27px; letter-spacing: -.06em; margin-bottom: 9px; }
    .milestone .name { font: 10px var(--mono); }
    .milestone[aria-selected="true"] { color: var(--orange); }
    .history-detail { display: grid; grid-template-columns: .45fr 1.1fr 1fr; gap: 40px; margin-top: 36px; align-items: start; min-height: 170px; }
    .history-number { font-family: Georgia,serif; color: #7c876f; font-size: 100px; line-height: 1; letter-spacing: -.08em; }
    .history-detail h3 { font-size: 28px; margin-bottom: 12px; }
    .history-detail p { font-size: 14px; line-height: 1.7; color: var(--subtle); }
    .history-detail .callout { margin-top: 0; }
    .group-control { display: flex; align-items: end; justify-content: space-between; gap: 10px; }
    .big-number { display: block; font-size: 66px; font-weight: 500; letter-spacing: -.07em; line-height: 1; }
    .group-control label { font-size: 12px; color: var(--subtle); }
    input[type="range"] { display: block; width: 100%; accent-color: var(--orange); min-height: 44px; margin: 15px 0 4px; }
    .range-labels { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--subtle); }
    .comparisons { margin-top: 20px; border-top: 1px solid var(--line); }
    .comparison { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .comparison span { font-size: 12px; color: var(--subtle); }
    .comparison strong { font: 20px var(--mono); font-weight: 500; }
    .comparison.tree strong { color: var(--green); }
    .group-views { margin: 22px 0; }
    .comparison-table-scroll { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .comparison-table { width: 100%; min-width: 760px; table-layout: fixed; border-collapse: collapse; }
    .comparison-table th, .comparison-table td { text-align: left; vertical-align: top; padding: 16px; border-bottom: 1px solid var(--line); }
    .comparison-table thead th { font: 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--subtle); background: #eef0e7; }
    .comparison-table tbody th { font-size: 15px; font-weight: 500; line-height: 1.4; }
    .comparison-table td { font-size: 12px; line-height: 1.65; }
    .comparison-table tbody tr:last-child > * { border-bottom: 0; background: var(--green-soft); }
    .comparison-table .approach-note { display: block; margin-top: 7px; font-size: 11px; font-weight: 400; line-height: 1.65; color: var(--subtle); }
    .comparison-table .ciphertext-count { display: block; margin-bottom: 5px; font: 19px var(--mono); color: var(--green); }
    .comparison-context { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; }
    .comparison-scroll-hint { display: none; }
    .group-costs { margin-top: 0; }
    .chart { width: 100%; height: 245px; }
    .legend { display: flex; flex-wrap: wrap; gap: 19px; font-size: 10px; color: var(--subtle); margin-top: 15px; }
    .legend span { display: flex; align-items: center; gap: 7px; }
    .swatch { width: 15px; height: 3px; background: var(--orange); display: inline-block; }
    .swatch.green { background: var(--green); }
    .swatch.gray { background: #c5cdba; }
    .idea-grid { display: grid; grid-template-columns: repeat(4,1fr); margin-top: 38px; }
    .idea { padding: 0 24px; border-left: 1px solid var(--line); }
    .idea:first-child { padding-left: 0; border: 0; }
    .idea:last-child { padding-right: 0; }
    .idea .idea-icon { width: 55px; height: 55px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); border-radius: 12px; margin-bottom: 22px; }
    .idea .idea-icon .icon { width: 25px; height: 25px; }
    .idea h3 { margin: 10px 0 12px; font-size: 23px; }
    .idea p { font-size: 13px; line-height: 1.75; color: var(--subtle); }
    .protocol-strip { display: flex; align-items: center; gap: 16px; margin-top: 38px; padding: 18px 22px; border-radius: 9px; background: var(--green-soft); color: var(--green); font-size: 13px; line-height: 1.7; }
    .protocol-strip .icon { width: 24px; height: 24px; }
    .tree-panel { padding: 18px; }
    .tree-svg { width: 100%; }
    .tree-choices { display: grid; grid-template-columns: repeat(8,1fr); gap: 3px; margin-top: 1px; }
    .tree-choices button { padding: 10px 0; min-height: 44px; font-size: 10px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--subtle); }
    .tree-choices button[aria-pressed="true"] { border-color: #dfbba9; color: var(--orange); background: var(--orange-soft); }
    .tree-choices button:hover { background: var(--orange-soft); }
    .tree-reading { margin-top: 22px; font-size: 15px; line-height: 1.7; }
    .tree-reading strong { color: var(--orange); font-weight: 500; }
    .lab { margin-top: 25px; display: grid; grid-template-columns: .82fr 1.2fr; gap: 28px; }
    .lab-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .lab-buttons .button { padding: 11px 12px; justify-content: flex-start; font-size: 12px; }
    .pending { margin-top: 18px; padding: 16px; border: 1px dashed #b3bba7; border-radius: 9px; min-height: 100px; background: #eef0e7; }
    .pending .button { margin-top: 12px; padding: 10px 14px; min-height: 40px; }
    .pending strong { font-size: 13px; font-weight: 500; display: block; margin: 6px 0; }
    .epoch-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .epoch-top strong { font-size: 36px; letter-spacing: -.05em; font-weight: 500; }
    .member-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .member { display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid #d1d9c8; border-radius: 8px; background: var(--surface); }
    .avatar { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; font: 12px var(--mono); color: var(--green); background: var(--green-soft); flex-shrink: 0; }
    .member strong { display: block; font-size: 12px; font-weight: 500; }
    .member small { font-size: 10px; color: var(--subtle); line-height: 1.6; }
    .member.waiting { border-style: dashed; border-color: #caa998; }
    .member.removed { opacity: .65; background: transparent; }
    .lab-offline { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 13px; }
    .lab-offline button { font-size: 11px; }
    .event-log { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); min-height: 66px; font-size: 11px; line-height: 1.8; color: var(--subtle); }
    .event-log p + p { margin-top: 4px; }
    .event-log strong { font-weight: 500; color: var(--green); }
    .security-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 35px; margin-top: 32px; }
    .security-grid > div { border-top: 1px solid var(--line); padding-top: 18px; }
    .security-grid h3 { font-size: 22px; margin-bottom: 9px; }
    .security-grid p { font-size: 13px; line-height: 1.7; color: var(--subtle); }
    .security-demo { margin-top: 25px; }
    .security-states { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .security-state { background: var(--green-soft); border: 1px solid #c9d4bf; padding: 15px; border-radius: 8px; }
    .security-state .icon { color: var(--green); margin-bottom: 13px; }
    .security-state strong { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
    .security-state span { color: var(--green); font-size: 11px; line-height: 1.7; display: block; }
    .security-state.exposed { background: var(--orange-soft); border-color: #d8b5a3; }
    .security-state.exposed .icon, .security-state.exposed span { color: var(--orange); }
    .security-state.future { background: #efefe7; border-color: var(--line); }
    .security-state.future span, .security-state.future .icon { color: var(--subtle); }
    .security-message { min-height: 44px; margin-top: 15px; }
    .lifecycle { display: grid; grid-template-columns: .68fr 1.4fr; gap: 35px; margin-top: 28px; }
    .step-list { display: grid; gap: 6px; }
    .step { display: flex; align-items: center; gap: 14px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; font-size: 13px; padding: 15px; min-height: 48px; }
    .step .step-num { color: var(--subtle); font: 10px var(--mono); }
    .step[aria-selected="true"] { background: var(--green-soft); border-color: #c7d3bc; color: var(--green); }
    .step[aria-selected="true"] .step-num { color: var(--green); }
    .lifecycle-detail { min-height: 300px; }
    .lifecycle-detail h3 { font-size: 27px; margin: 24px 0 15px; }
    .flow-parties { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .flow-party { display: flex; align-items: center; gap: 9px; font-size: 12px; }
    .flow-link { flex: 1; height: 1px; border-top: 1px dashed #99a88b; }

        { name: 'Chen', known: 0, joined: 0, active: true }
      ], events: ['The group starts with Alice, Bob, and Chen in epoch 0.'] };
    }
    const milestones = [
      { year: '1991', short: 'PGP', title: 'Private mail goes public.', text: 'Pretty Good Privacy put public-key encryption into people’s hands. A sender could encrypt mail for a recipient without first sharing a secret password.', lesson: 'The next challenge: make private, ongoing conversations convenient, with protection when long-term keys leak.', url: sourceURLs.pgp, label: 'Zimmermann’s original account' },
      { year: '2004', short: 'OTR', title: 'Conversations get short-lived keys.', text: 'Off-the-Record Messaging brought forward secrecy and deniable authentication to live, one-to-one chat.', lesson: 'The next challenge: keep conversations secure when people and devices are not online together.', url: sourceURLs.otr, label: 'OTR project and 2004 paper' },
      { year: '2010s', short: 'Ratchets', title: 'Keys evolve as people talk.', text: 'Signal’s Double Ratchet combines a per-message symmetric ratchet with fresh Diffie–Hellman inputs. It gives two-party messaging forward secrecy and recovery after some compromises.', lesson: 'The next challenge: efficiently refresh keys for a whole group as membership changes.', url: sourceURLs.signal, label: 'The Double Ratchet specification' },
      { year: '2023', short: 'MLS', title: 'Group key agreement becomes a standard.', text: 'The IETF published MLS as RFC 9420 in July 2023. Tree-based key agreement lets changing groups establish fresh shared state without everyone being online.', lesson: 'The shift: design authenticated, asynchronous key agreement for groups from the start.', url: sourceURLs.announcement, label: 'IETF publication announcement' },
      { year: '2025', short: 'Architecture', title: 'The surrounding system gets a guide.', text: 'RFC 9750, published in April 2025, describes the architecture around MLS: clients, authentication, delivery, and the decisions an application still makes.', lesson: 'The next step: combine the cryptographic protocol with a reliable, well-designed application.', url: sourceURLs.architecture, label: 'RFC 9750, MLS Architecture' }
    ];
    const lifecycleSteps = [
      { label:'Publish', title:'A device publishes a KeyPackage.', from:'Dana’s device', to:'KeyPackage directory', payload:'Signed public keys + credential + capabilities', text:'Dana keeps the matching private keys on her device. An existing member can fetch this signed package to invite her while she is offline.', note:'Authenticate the credential’s binding to Dana. A self-signed identity label alone proves no real-world identity.', source:'packages' },
      { label:'Propose', title:'A member proposes a change.', from:'Alice', to:'Existing members', payload:'Add(Dana’s KeyPackage)', text:'An Add proposal describes a possible membership change. Proposals can travel separately or be included directly inside a Commit.', note:'A proposal by itself does not change the group’s epoch or membership.', source:'protocol' },
      { label:'Commit', title:'A Commit advances the group.', from:'Alice', to:'Existing members', payload:'Commit + fresh group state for epoch e + 1', text:'Existing members validate and process the accepted Commit. It applies the selected proposals and advances the cryptographic state.', note:'Your delivery design must resolve concurrent commits into a consistent accepted order.', source:'processing' },
      { label:'Welcome', title:'Dana joins the new epoch.', from:'Inviting member', to:'Dana’s device', payload:'Welcome encrypted for Dana’s KeyPackage', text:'Dana processes the Welcome and validates the group and credentials. She obtains state for the epoch in which she joined.', note:'Deliver the Welcome after its Commit is accepted. Earlier message history needs a separate application policy.', source:'join' },
      { label:'Message', title:'Members exchange protected messages.', from:'A member’s device', to:'Other member devices', payload:'Application ciphertext, relayed by the delivery service', text:'MLS derives sender-specific message keys from the epoch’s secret tree. Devices protect and authenticate content locally, while a service routes the resulting ciphertext.', note:'A new application message uses a new message key. Sending a message alone does not advance the group epoch.', source:'messages' }
    ];
    const codeExamples = [
      { label:'Add', title:'Add a device with OpenMLS.', description:'Use a maintained protocol implementation. This Rust excerpt assumes an existing group, provider, signer, and a validated KeyPackage for Bob.', code:`let (commit, welcome, _info) = group\n    .add_members(\n        provider,\n        &signer,\n        &[bob_key_package],\n    )?;\n\n// Distribute the accepted Commit to members.\n// Merge locally after delivery accepts it.\ngroup.merge_pending_commit(provider)?;\n\n// Then deliver Welcome to Bob.`, note:'Delivery, serialization, credentials, and persistence are application code. This is an excerpt, not a standalone Rust program.', source:'add' },
      { label:'Join', title:'Join from a Welcome.', description:'Bob uses his device’s stored private keys to open the Welcome. The example assumes the ratchet tree extension is available in the Welcome.', code:`let staged = StagedWelcome::new_from_welcome(\n    provider,\n    &join_config,\n    welcome,\n    None,\n)?;\n\n// Validate the inviter and member credentials.\n// Check your app’s authorization policy.\nlet mut group = staged.into_group(provider)?;`, note:'Without the ratchet tree extension, supply the authenticated ratchet tree rather than None. Only join after the related Commit is accepted.', source:'join' },

    const slides = [
      { chapter:0, title:'Privacy is a group effort.', kicker:'Why end-to-end encryption', source:'architecture', sourceLabel:'Based on RFC 9750 and RFC 9420', notes:'Open with a simple question: should the company delivering your conversation need access to its words? E2EE moves content protection to participants’ devices. Explain that this is a developer-oriented introduction, with conceptual demonstrations rather than real cryptography. The path is why E2EE, a short history, MLS mechanics, and integration.', render:coverSlide },
      { chapter:0, title:'Who holds the keys?', kicker:'01 / The reason for E2EE', source:'architecture', sourceLabel:'RFC 9750, Introduction and Security Goals', notes:'Select Transport encryption first, then End-to-end encryption. In a common client-server messaging design, TLS protects each connection but the server processes plaintext. E2EE protects the content across that server boundary. TLS remains useful underneath E2EE. Authentication and secure endpoints are assumptions. Avoid suggesting that E2EE hides all metadata.', render:transportSlide },
      { chapter:1, title:'From private mail to private groups.', kicker:'02 / A little history', source:'announcement', sourceLabel:'Primary historical sources in each milestone', notes:'Walk from PGP through OTR and the Double Ratchet before selecting MLS. These are selected milestones in messaging security, not a strict replacement chain. OTR’s 2004 publication is linked from its project page. The Double Ratchet milestone uses a decade rather than claiming an exact invention date. RFC 9420 dates to July 2023 and RFC 9750 to April 2025.', render:historySlide },
      { chapter:1, title:'Groups change. Key distribution gets harder.', kicker:'02 / The group problem', source:'protocol', sourceLabel:'RFC 9420 §1; group strategies and ideal update model', notes:'Start with Compare approaches. The classic Double Ratchet secures a two-party session. Building a full mesh for n devices means n(n−1)/2 pairwise sessions, and naive pairwise sending produces n−1 ciphertexts per group message. Sender keys use pairwise channels for setup but a shared sender chain for messages, so they avoid that per-message duplication. A hash ratchet provides forward secrecy with key deletion but does not by itself heal a stolen sender chain. Fresh sender keys need secure redistribution. MLS also uses ratcheting: TreeKEM coordinates group key agreement and membership, while its separate secret tree supplies per-sender message ratchets. Both the Double Ratchet and MLS can recover from compromise under their respective assumptions, including loss of attacker access and suitable fresh key input. Then select Explore update costs and move the group size slider. The chart compares n−1 individually distributed secret envelopes with log2(n) copath envelopes in an ideal full binary ratchet tree, for powers of two only. It models one member’s fresh secret distribution, not application ciphertext counts, measured speed, or the cost of every MLS Commit. Tree shape, blank nodes, proposals, and fanout affect actual costs.', render:groupProblemSlide },
      { chapter:2, title:'Four ideas behind MLS.', kicker:'03 / Inside the protocol', source:'protocol', sourceLabel:'RFC 9420 §§5, 7, 8, 10, 12', notes:'Expand MLS as Messaging Layer Security. A KeyPackage is signed public invitation material, not a private key. TreeKEM handles group key agreement. Commits advance epochs. A separate secret tree derives per-sender, per-message keys. These two trees have different jobs. Devices are the unit of membership, so one human can occupy several leaves.', render:ideasSlide },
      { chapter:2, title:'One update travels up the tree.', kicker:'03 / The ratchet tree', source:'protocol', sourceLabel:'RFC 9420 §§4, 7, 12; simplified full tree', notes:'Click Alice, then Hana. Orange marks the updating leaf and direct path to the root. Green outlines mark copath subtrees: fresh path secrets are encrypted to their resolutions so other members can compute the new common state. The example is a full, balanced tree with eight clients. Everyone has the public tree, but each member only holds private key material for its own path. The ratchet tree is separate from the secret tree used for application messages.', render:treeSlide },
      { chapter:2, title:'A group changes. Its keys change with it.', kicker:'03 / Try the epoch lab', source:'protocol', sourceLabel:'RFC 9420 §§12–14; conceptual simulation', notes:'First propose adding Dana and point out that nothing happens to the active membership until Commit. Commit and note the Welcome. Take Chen offline, commit an update, reconnect Chen, and catch up the missing commits. Send a message before and after catch-up. Finally remove Bob. Bob loses access to new epochs but retains old content he already knew. This simulator assumes one accepted commit sequence and immediate delivery to online clients. It does not implement MLS cryptography.', render:labSlide },
      { chapter:2, title:'Protect the past. Recover the future.', kicker:'03 / Security over time', source:'architecture', sourceLabel:'RFC 9750 Security Goals; RFC 9420 §17', notes:'Forward secrecy depends on deleting obsolete secret state. It does not erase stored plaintext or copies. The compromise illustration assumes just Alice’s device is compromised. To demonstrate post-compromise recovery, the attacker must lose endpoint access and Alice’s recovered client must contribute a fresh update that the group accepts. A passive per-message hash ratchet alone does not heal a compromised group. Other compromised clients would need appropriate recovery too.', render:securitySlide },
      { chapter:2, title:'The life of a private group.', kicker:'03 / From invitation to conversation', source:'protocol', sourceLabel:'RFC 9420; linked OpenMLS operation guides', notes:'Use the stepper to narrate the protocol flow. Proposals can be sent separately or embedded in a Commit. Existing members process the Commit, while the new device initializes from Welcome. Newcomers do not automatically get old messages. Application messages use sender-specific message keys and do not themselves advance epochs. A group needs one consistent accepted sequence of commits.', render:lifecycleSlide },
      { chapter:3, title:'Use a library. Build the experience.', kicker:'04 / MLS in application code', source:'openmls', sourceLabel:'OpenMLS Book; API excerpts checked November 2026', notes:'OpenMLS is one implementation, in Rust. Tabs show API excerpts mapped to its official book, with setup and transport intentionally omitted. These are not compiled examples and the presentation is not an MLS client. Use the complete linked examples and pin an appropriate dependency version when integrating. Explain that credentials need an external trust binding, providers need persistent storage, and the delivery protocol must establish which Commit was accepted before local merge and Welcome delivery.', render:codeSlide },
      { chapter:3, title:'MLS is one part of your application.', kicker:'04 / The integration boundary', source:'architecture', sourceLabel:'RFC 9750 §§2–5; OpenMLS credential and delivery guidance', notes:'The Authentication Service binds an account or device identity to signing keys, according to your trust model. Endpoints perform MLS operations and retain private state. The Delivery Service routes messages and helps produce an accepted Commit order. Open each responsibility. MLS does not supply an application login system, admin policy, traffic anonymity, a backup design, or availability. Multi-device accounts need explicit per-device membership and revocation.', render:integrationSlide },
      { chapter:3, title:'Three quick checks.', kicker:'04 / Test your mental model', source:'protocol', sourceLabel:'Answers grounded in RFC 9420 and RFC 9750', notes:'Ask the audience to vote before selecting each answer. The three distinctions are proposal versus commit, joining state versus historical messages, and content confidentiality versus metadata and availability. Wrong answers show the correct explanation immediately. The quiz is entirely local and does not collect responses.', render:quizSlide },
      { chapter:3, title:'Private by design. Built for the group.', kicker:'The takeaway', source:'protocol', sourceLabel:'MLS protocol: RFC 9420, July 2023 · Architecture: RFC 9750, April 2025', notes:'Recap: E2EE keeps content keys at endpoints. MLS gives changing groups authenticated, evolving cryptographic state. Applications still own identity, delivery, local storage, and user experience. Point to the protocol, architecture, and OpenMLS book for the next level of detail. Reopen the lab for questions if useful.', render:closingSlide }
    ];

    function coverSlide() {
      return `<div class="cover-grid"><div class="cover-copy"><div class="cover-meta"><span class="tag">MLS / RFC 9420</span><span>13 slides · ~15 minutes</span></div><div class="eyebrow">Why end-to-end encryption</div><h1 id="slide-title" tabindex="-1">Privacy is a <br><span class="serif">group effort.</span></h1><p class="lead">Our conversations keep growing. Their privacy should keep up.<br><br>A hands-on introduction to Messaging Layer Security.</p><div class="actions"><button class="button" data-action="next">Let’s start ${icon('arrow')}</button><button class="text-button" data-action="go" data-value="5">Explore the key tree ${icon('arrow')}</button></div></div><div class="hero-art">${heroArt()}<div class="hero-caption"><span class="status-dot"></span>SHARED SECRETS. CHANGING MEMBERS.</div></div></div>`;

65e">DANA</text></g><g><circle cx="99" cy="184" r="29" fill="#e2e9d6" stroke="#9eaf8c"/><text x="99" y="191" font-size="20" fill="#325b43">E</text><text x="99" y="235" font-size="10" fill="#5f665e">ELI</text></g></g><g transform="translate(302 104) rotate(9)"><rect width="150" height="48" rx="9" fill="#fff" stroke="#d5dacb"/><path d="m17 16 4 4 7-8" fill="none" stroke="#325b43" stroke-width="1.5"/><text x="40" y="23" fill="#325b43" font-family="monospace" font-size="11">c42b 8f1a 9e03</text><text x="40" y="36" fill="#5f665e" font-family="monospace" font-size="7">ENCRYPTED CONTENT</text></g><g transform="translate(44 279) rotate(-7)"><rect width="157" height="53" rx="9" fill="#fff" stroke="#d5dacb"/><text x="16" y="22" fill="#272c28" font-family="Helvetica Neue,Arial,sans-serif" font-size="12">Coffee at 10?</text><text x="16" y="38" fill="#5f665e" font-family="monospace" font-size="7">ONLY ON MEMBER DEVICES</text></g></svg>`;
    }
    function heading() { const s=slides[state.slide]; return `<div class="eyebrow">${s.kicker}</div><h2 id="slide-title" tabindex="-1">${s.title}</h2>`; }
    function concept(name, title, text) { return `<div class="concept">${icon(name)}<div><strong>${title}</strong><p>${text}</p></div></div>`; }
    function transportSlide() {
      const e2ee=state.transport==='e2ee';
      return `${heading()}<div class="split top"><div class="intro"><p class="lead">Encryption protects a message from the people who don’t have its keys. The key question is who does.</p><div class="concept-list">${concept('server','Transport encryption','TLS secures the connection to the service. The service can still handle plaintext.')}${concept('lock','End-to-end encryption','Member devices hold the content keys. The delivery service relays ciphertext.')}</div><div class="callout">E2EE applications still use TLS. The two protect different boundaries.</div></div><div class="panel"><div class="tabs" role="tablist" aria-label="Encryption model"><button id="tls-tab" class="tab" role="tab" aria-selected="${!e2ee}" aria-controls="transport-panel" tabindex="${!e2ee?0:-1}" data-action="transport" data-value="tls">Transport / TLS</button><button id="e2ee-tab" class="tab" role="tab" aria-selected="${e2ee}" aria-controls="transport-panel" tabindex="${e2ee?0:-1}" data-action="transport" data-value="e2ee">End-to-end / E2EE</button></div><div id="transport-panel" class="transport" role="tabpanel" aria-labelledby="${e2ee?'e2ee':'tls'}-tab"><div class="route"><div class="endpoint"><div class="device">${icon('device')}</div><strong>Alice</strong><span>“Coffee at 10?”</span></div><div class="wire">${icon('lock')}</div><div class="server">${icon('server')}<h3>Delivery service</h3><div class="payload ${e2ee?'encrypted':''}">${e2ee?'c42b 8f1a 9e03':'Coffee at 10?'}</div><span class="tag ${e2ee?'green':'orange'}">${e2ee?'Sees ciphertext':'Can read content'}</span></div><div class="wire">${icon('lock')}</div><div class="endpoint"><div class="device">${icon('device')}</div><strong>Bob</strong><span>“Coffee at 10?”</span></div></div><p class="route-message">${e2ee?'Alice encrypts on her device. Bob decrypts on his. The service delivers the message without holding the content keys.':'Each TLS connection ends at the service. In this common design, the service can read the message before sending it to Bob.'}</p><p class="small">Conceptual illustration. Content confidentiality assumes authenticated keys and uncompromised endpoints.</p></div></div></div>`;
    }
    function historySlide() {
      const m=milestones[state.milestone];
      return `${heading()}<p class="lead">The ambition stayed the same. The key management kept evolving.</p><div class="timeline-tabs" role="tablist" aria-label="Encryption milestones">${milestones.map((x,i)=>`<button class="milestone" id="history-tab-${i}" role="tab" aria-selected="${i===state.milestone}" aria-controls="history-detail" tabindex="${i===state.milestone?0:-1}" data-action="milestone" data-value="${i}"><span class="year">${x.year}</span><span class="name">${x.short}</span></button>`).join('')}</div><div class="history-detail" id="history-detail" role="tabpanel" aria-labelledby="history-tab-${state.milestone}"><div class="history-number" aria-hidden="true">${String(state.milestone+1).padStart(2,'0')}</div><div><h3>${m.title}</h3><p>${m.text}</p><p class="small" style="margin-top:14px">${external(m.url,m.label)}</p></div><div class="callout">${m.lesson}</div></div><p class="small" style="margin-top:18px">Select a milestone to explore. These are parallel lines of research, with different goals and trade-offs.</p>`;
    }
    function groupProblemSlide() {
      const compare=state.groupView==='compare';
      return `${heading()}
        <p class="lead">Double Ratchet secures two-party sessions. A group also needs to coordinate shared keys and changing membership.</p>
        <div class="tabs group-views" role="tablist" aria-label="The group problem views">
          <button class="tab" role="tab" id="group-compare-tab" aria-selected="${compare}" aria-controls="group-problem-panel" tabindex="${compare?0:-1}" data-action="group-view" data-value="compare">Compare approaches</button>
          <button class="tab" role="tab" id="group-costs-tab" aria-selected="${!compare}" aria-controls="group-problem-panel" tabindex="${!compare?0:-1}" data-action="group-view" data-value="costs">Explore update costs</button>
        </div>
        <div id="group-problem-panel" role="tabpanel" aria-labelledby="${compare?'group-compare-tab':'group-costs-tab'}">${compare?groupApproachComparison():groupUpdateCosts()}</div>`;
    }
    function groupApproachComparison() {
      return `<div class="comparison-context"><span class="small">For <strong>n member devices</strong>, comparing one group message.</span><span class="small comparison-scroll-hint">Scroll the table horizontally to compare.</span></div>
        <div class="comparison-table-scroll" role="region" aria-label="Group protocol comparison, horizontally scrollable" tabindex="0" data-horizontal-scroll>
          <table class="comparison-table">
            <caption class="sr-only">Pairwise Double Ratchet sessions, sender keys, and MLS: ciphertext output, membership, and recovery.</caption>
            <colgroup><col style="width:22%"><col style="width:18%"><col style="width:28%"><col style="width:32%"></colgroup>
            <thead><tr><th scope="col">Approach</th><th scope="col">Sender’s output</th><th scope="col">Membership changes</th><th scope="col">Recovery after compromise</th></tr></thead>
            <tbody>
              <tr><th scope="row">Pairwise ${external(sourceURLs.signal,'Double Ratchet')}<span class="approach-note">Full mesh: n(n − 1) / 2 two-party sessions.</span></th><td><span class="ciphertext-count">n − 1</span>Separate recipient ciphertexts.</td><td>The application coordinates the roster and which recipient sessions to use.</td><td>Fresh DH input heals each affected session. The application must coordinate recovery across the group.</td></tr>
              <tr><th scope="row">Sender keys<span class="approach-note">Sender hash chains, distributed over pairwise channels.</span></th><td><span class="ciphertext-count">1</span>Group ciphertext per message.</td><td>The application rotates and redistributes sender keys to fit the new membership.</td><td>Fresh sender keys need secure redistribution. A hash ratchet alone cannot heal a leaked sender chain.</td></tr>
              <tr><th scope="row">MLS<span class="approach-note">TreeKEM agreement + per-sender message ratchets.</span></th><td><span class="ciphertext-count">1</span>Group ciphertext per message.</td><td>An accepted Commit applies Add/Remove proposals and advances the epoch.</td><td>Fresh updates from recovered members refresh group secrets through the ratchet tree.</td></tr>
            </tbody>
          </table>
        </div>
        <div class="callout"><strong>MLS uses ratchets too.</strong> Its advantage here is coordinating group membership and fresh shared state. Both MLS and the Double Ratchet support forward secrecy and recovery under their respective assumptions.</div>
        <p class="small" style="margin-top:14px">Counts describe sender ciphertexts, not delivery copies: the service still fans out to recipients. Forward secrecy needs key deletion. Recovery assumes the attacker loses device access and fresh key updates succeed.</p>`;
    }
    function groupUpdateCosts() {
      const n=2**state.groupPower;
      return `<div class="split group-costs"><div><p class="lead">Now compare distributing <strong>one member’s fresh secret</strong> separately to each recipient with using an ideal MLS tree.</p><div class="group-control" style="margin-top:25px"><div><span class="subhead">Group size</span><output class="big-number" id="group-size" for="group-range">${n.toLocaleString()}</output></div><label for="group-range">member devices</label></div><input type="range" id="group-range" min="1" max="10" step="1" value="${state.groupPower}" aria-label="Group size, in powers of two" aria-valuetext="${n} member devices"><div class="range-labels"><span>2 devices</span><span>1,024 devices</span></div><div class="comparisons" id="scale-counts">${scaleCounts()}</div></div><figure class="panel white-panel"><div class="subhead">Illustrative encrypted secret envelopes per refresh</div><div id="scale-chart">${scaleChart()}</div><div class="legend"><span><i class="swatch"></i>Separate recipient envelopes</span><span><i class="swatch green"></i>Ideal binary-tree envelopes</span></div><figcaption class="small" style="margin-top:15px">A full, balanced tree gives a logarithmic update path. This model counts secret envelopes, not application ciphertexts, bytes, total delivery traffic, or measured speed.</figcaption></figure></div><div class="callout">Refreshing one sender key also needs recipient distribution. Refreshing all sender keys adds work. Real MLS costs depend on tree shape, blank nodes, and Commit contents.</div>`;
    }
    function scaleCounts() { const n=2**state.groupPower; return `<div class="comparison"><span>Separate recipients · n − 1</span><strong>${(n-1).toLocaleString()}</strong></div><div class="comparison tree"><span>Ideal tree · log₂(n)</span><strong>${state.groupPower}</strong></div>`; }
    function scaleChart() {
      const w=500,h=245,left=45,right=480,top=22,bottom=207;
      const x=(p)=>left+(p-1)/9*(right-left), y=(v)=>bottom-v/1024*(bottom-top);
      const direct=Array.from({length:10},(_,i)=>`${x(i+1)},${y(2**(i+1)-1)}`).join(' ');
      const tree=Array.from({length:10},(_,i)=>`${x(i+1)},${y(i+1)}`).join(' ');

    function treeReading() { return `<strong>${treeNames[state.treeMember]}</strong> refreshes its leaf and <strong>3 ancestor nodes</strong>. The update encrypts fresh path secrets for the sibling subtrees, so the other members can derive the next shared state.`; }
    function treeDiagram() {
      const nodes=Array.from({length:15},(_,i)=>{ const level=Math.floor(Math.log2(i+1)), j=i-(2**level-1); return {x:(j+.5)*800/2**level,y:35+level*82}; });
      const path=new Set(); let cur=7+state.treeMember; while(cur>=0){path.add(cur); if(cur===0)break; cur=Math.floor((cur-1)/2);}
      const siblings=new Set(); for(const i of path)if(i>0)siblings.add(i%2===1?i+1:i-1);
      const lines=nodes.slice(1).map((n,j)=>{const i=j+1,p=nodes[Math.floor((i-1)/2)];return `<path d="M${p.x} ${p.y+12}V${p.y+29}H${n.x}V${n.y-13}" fill="none" stroke="${path.has(i)?'#ad3c20':'#c8d0bb'}" stroke-width="${path.has(i)?3:1.5}"/>`;}).join('');

    function securitySlide() { return `${heading()}<p class="lead">Two security properties answer different questions about a leaked key.</p><div class="security-grid"><div><div class="subhead">Looking backward</div><h3>Forward secrecy</h3><p>Stealing current secret state should not reveal earlier messages whose message keys and obsolete state have been erased.</p></div><div><div class="subhead">Looking forward</div><h3>Post-compromise security</h3><p>After the attacker loses device access, a fresh update from the recovered client can restore confidentiality for future messages.</p></div></div><div id="security-demo" class="security-demo">${securityDemo()}</div><p class="small" style="margin-top:17px">This illustration assumes only Alice was compromised. Recovery needs fresh secret input, a cleaned endpoint, and successful Commit processing. Stored plaintext remains readable.</p>`; }

        if(!l.pending)return;
        l.epoch++;
        if(l.pending==='add'){l.members.push({name:'Dana',known:l.epoch,joined:l.epoch,active:true});message=`Epoch ${l.epoch}: Dana joins with a Welcome. Earlier history is not included.`;}
        if(l.pending==='remove'){l.members.find(m=>m.name==='Bob').active=false;message=`Epoch ${l.epoch}: Bob is removed. He retains old content but receives no new group secrets.`;}
        if(l.pending==='update')message=`Epoch ${l.epoch}: Alice contributes a fresh leaf and path update.`;
        for(const m of l.members)if(m.active&&(m.name!=='Chen'||l.chenOnline))m.known=l.epoch;
        l.pending=null;addLabEvent(message);
      }
      if(action==='lab-offline'){l.chenOnline=!l.chenOnline;message=l.chenOnline?'Chen is online. Catch up any missing Commits before processing new-epoch content.':'Chen is offline. Subsequent Commits will queue for catch-up.';addLabEvent(message);}
      if(action==='lab-catchup'){const chen=l.members.find(m=>m.name==='Chen');if(!l.chenOnline||chen.known===l.epoch)return; const count=l.epoch-chen.known;chen.known=l.epoch;message=`Chen processes ${count} queued Commit${count===1?'':'s'} and reaches epoch ${l.epoch}.`;addLabEvent(message);}
      if(action==='lab-message'){
        const readers=l.members.filter(m=>m.active&&(m.name!=='Chen'||l.chenOnline)&&m.known===l.epoch).map(m=>m.name);
        const chen=l.members.find(m=>m.name==='Chen');
        message=`Epoch ${l.epoch} message: readable by ${readers.join(', ')}.`;
        if(!l.chenOnline||chen.known<l.epoch)message+=' Chen’s delivery waits for reconnection and any missing Commits.';
        const bob=l.members.find(m=>m.name==='Bob');if(!bob.active)message+=' Bob cannot decrypt this new-epoch message.';
        addLabEvent(message);
      }
      const focusAction=action==='lab-commit'?'lab-message':action==='lab-propose'?'lab-commit':action==='lab-catchup'?'lab-message':action;
      document.getElementById('lab-content').innerHTML=labContent();
      const control=document.querySelector(`[data-action="${focusAction}"]`);if(control&&!control.disabled)control.focus({preventScroll:true});
      announce(message);
      if(document.fullscreenElement)requestAnimationFrame(fitFullscreen);
    }
    function fitFullscreen() {
      const app=document.getElementById('app');
      app.style.removeProperty('zoom');
      if(!document.fullscreenElement)return;
      const bounds=app.getBoundingClientRect();
      const scale=Math.min(1,innerWidth/bounds.width,(innerHeight-16)/(bounds.height+16));
      app.style.zoom=String(scale);
    }
    async function fullscreen() {
      try { if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw new Error('unavailable'); }
      catch { const t=document.getElementById('toast');t.textContent='Fullscreen is unavailable in this viewer. Open index.html in a browser to present.';t.hidden=false;setTimeout(()=>t.hidden=true,4500); }
    }
    document.addEventListener('click',event=>{
      const target=event.target.closest('[data-action]'); if(!target||target.disabled)return;
      const action=target.dataset.action, value=target.dataset.value, n=Number(value);
      if(action==='go'){if(n===state.slide&&modal.open){modal.close();document.getElementById('slide-title').focus();}else navigate(n);}
      else if(action==='next')navigate(state.slide+1);
      else if(action==='prev')navigate(state.slide-1);
      else if(action==='notes')toggleNotes();
      else if(['sources','overview','help'].includes(action))openDialog(action);
      else if(action==='close')modal.close();
      else if(action==='fullscreen')fullscreen();
      else if(action==='transport'){state.transport=value;refresh(`[data-action="transport"][data-value="${value}"]`,value==='e2ee'?'E2EE: the service sees ciphertext.':'Transport encryption: the service can read message content.');}
      else if(action==='milestone'){state.milestone=n;refresh(`[data-action="milestone"][data-value="${n}"]`,milestones[n].title);}
      else if(action==='group-view'){state.groupView=value;refresh(`[data-action="group-view"][data-value="${value}"]`,value==='compare'?'Comparing pairwise Double Ratchet sessions, sender keys, and MLS.':'Exploring one member’s fresh secret distribution costs.');}
      else if(action==='tree-member'){
        state.treeMember=n;document.getElementById('tree-diagram').innerHTML=treeDiagram();document.getElementById('tree-reading').innerHTML=treeReading();document.querySelectorAll('[data-action="tree-member"]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.value)===n)));announce(`${treeNames[n]} updates its leaf and three ancestors.`);
      }
      else if(action.startsWith('lab-'))labAction(action,value);
      else if(action.startsWith('security-')){state.security=action==='security-expose'?'exposed':action==='security-heal'?'healed':'safe';document.getElementById('security-demo').innerHTML=securityDemo();document.querySelector(`[data-action="${state.security==='exposed'?'security-heal':state.security==='healed'?'security-reset':'security-expose'}"]`).focus({preventScroll:true});announce(state.security==='exposed'?'Alice’s current state is exposed. Future messages are vulnerable until recovery.':state.security==='healed'?'Fresh secrets restore protection after recovery and an accepted update.':'Compromise demonstration reset.');}
      else if(action==='lifecycle'){state.lifecycle=n;refresh(`[data-action="lifecycle"][data-value="${n}"]`,lifecycleSteps[n].title);}
      else if(action==='code'){state.codeTab=n;refresh(`[data-action="code"][data-value="${n}"]`,codeExamples[n].title);}
      else if(action==='quiz-answer'){
        if(state.quizAnswers[state.quizQuestion]!==undefined)return;
        state.quizAnswers[state.quizQuestion]=n;document.getElementById('quiz-content').innerHTML=quizContent();document.querySelector('[data-action="quiz-next"]').focus({preventScroll:true});announce(quizQuestions[state.quizQuestion].feedback);
      }
      else if(action==='quiz-next'){
        if(state.quizAnswers[state.quizQuestion]===undefined)return;
        if(state.quizQuestion===2)state.quizComplete=true;else state.quizQuestion++;
        document.getElementById('quiz-content').innerHTML=quizContent();
        document.querySelector(state.quizComplete?'#quiz-content [data-action="next"]':'[data-action="quiz-answer"]').focus({preventScroll:true});
      }
      else if(action==='quiz-reset'){state.quizQuestion=0;state.quizAnswers=[];state.quizComplete=false;document.getElementById('quiz-content').innerHTML=quizContent();document.querySelector('[data-action="quiz-answer"]').focus({preventScroll:true});}
    });
    document.addEventListener('input',event=>{
      if(event.target.id!=='group-range')return;
      state.groupPower=Number(event.target.value);const n=2**state.groupPower;
      document.getElementById('group-size').textContent=n.toLocaleString();event.target.setAttribute('aria-valuetext',`${n} member devices`);
      document.getElementById('scale-counts').innerHTML=scaleCounts();document.getElementById('scale-chart').innerHTML=scaleChart();
    });
    document.addEventListener('keydown',event=>{
      if(event.altKey||event.metaKey||event.ctrlKey||event.target.closest('input, textarea, select, [contenteditable="true"]'))return;
      if(event.target.closest('[data-horizontal-scroll]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      const tablist=event.target.closest('[role="tablist"]');
      if(tablist&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)){
        const tabs=Array.from(tablist.querySelectorAll('[role="tab"]')), index=tabs.indexOf(event.target.closest('[role="tab"]'));
        let next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(['ArrowLeft','ArrowUp'].includes(event.key)?-1:1)+tabs.length)%tabs.length;
        event.preventDefault();tabs[next].click();return;
      }
      if(modal.open)return;
      if(event.key===' '&&event.target.closest('button,a,summary'))return;
      const key=event.key.toLowerCase();
      if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();navigate(state.slide+1);}
      else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();navigate(state.slide-1);}
      else if(event.key==='Home'){event.preventDefault();navigate(0);}
      else if(event.key==='End'){event.preventDefault();navigate(slides.length-1);}
      else if(key==='o')openDialog('overview');
      else if(key==='n')toggleNotes();
      else if(key==='r')openDialog('sources');
      else if(key==='f')fullscreen();
      else if(key==='?')openDialog('help');
    });
    document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();document.getElementById('slide-title').focus();});
    window.addEventListener('popstate',()=>{state.slide=readSlideHash();render(true);});
    window.addEventListener('hashchange',()=>{if(location.hash==='#slide-title')return;const n=readSlideHash();if(n!==state.slide){state.slide=n;render(true);}});
    document.addEventListener('fullscreenchange',()=>{document.querySelector('[data-action="fullscreen"]').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');fitFullscreen();});
    window.addEventListener('resize',()=>{if(document.fullscreenElement)requestAnimationFrame(fitFullscreen);});
    document.addEventListener('toggle',event=>{if(event.target.tagName==='DETAILS'&&document.fullscreenElement)requestAnimationFrame(fitFullscreen);},true);
    document.getElementById('brand-icon').innerHTML=icon('tree');
    const toolIcons={sources:'book',notes:'notes',overview:'grid',fullscreen:'fullscreen',prev:'back',next:'arrow'};
    document.querySelectorAll('.tools button,.slide-controls button').forEach(b=>b.innerHTML=icon(toolIcons[b.dataset.action]));
    state.slide=readSlideHash();
    render();
  </script>
</body>
</html>
